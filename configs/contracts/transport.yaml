# Safety contract for the planar carry-and-place transport task.
# Owned by the human safety authority: the improvement agent can read
# it but never write it.  Sign after editing:
#     sear sign-contract configs/contracts/transport.yaml
#
# Key hazard: inertial slip during free-space transit (fn=0).  CBF is
# inactive when not in contact, so this constraint cannot be enforced
# by a contact-based runtime filter — verification must catch it.
name: transport_surrogate
version: "1.0.0"
description: Carry-and-place with inertial-slip risk during free-space transit.
constraints:
  # ------------------------------------------------------------ physical
  - type: signal_bound
    name: tool_retention
    signal: tool_slip
    upper: 0.5             # normalized slip budget; 1.0 = tool lost
  - type: signal_bound
    name: speed_limit
    signal: ee_speed
    upper: 0.8             # m/s — loose enough for transit; tight enough for safety
  - type: signal_bound
    name: collision_clearance
    signal: min_distance
    lower: 0.005           # m to fixture surface
  - type: workspace_box
    name: workspace
    signal: ee_pos
    low: [-0.25, -0.02]
    high: [0.75, 0.40]
  # ------------------------------------------------------------ temporal
  - type: response_within
    name: human_safe_stop
    trigger: human_in_zone
    response: stopped
    max_delay: 0.3         # s
  # ---------------------------------------------------------- operational
  - type: allowed_tools
    name: tool_whitelist
    allowed: [gripper.hold, gripper.transport]
  - type: max_duration
    name: max_episode_duration
    seconds: 7.0
  - type: approved_modes
    name: approved_modes
    modes: [simulation, low_energy]
